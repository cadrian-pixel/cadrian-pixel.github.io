<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>FM SynthWiki</title>
</head>
<body>
    <svg width="1000" height="400">
        <defs>
            <linearGradient id="GRADA">
                <stop offset="0%" stop-color="rgb(0, 60, 0)"></stop>
                <stop offset="100%" stop-color="rgb(0, 120, 0)"></stop>
            </linearGradient>
        </defs>
        <rect rx="50" ry="20" width="600" height="200" style="fill:url(#GRADA);stroke:rgb(0, 40, 0);stroke-width:3;opacity:0.8" />
        <text fill="rgb(0, 216, 50)" font-size="50px" font-family="Cambria" x="150" y="100">FM SynthWiki</text>
        Sorry, your browser does not support inline SVG.
    </svg>
    <p>Welcome to FM SynthWiki, the definitive resource for FM technology.</p>
    <h2><strong>List of Current Pages</strong></h2>
    <p>Click on one of the elements listed below to start reading!</p>
        <ul>
            <li><a href="ym2151.html">Study the YM2151 here</a></li>
            <li><a href="ym2612.html">Study the YM2612 here</a></li>
            <li><a href="ym2203.html">Study the YM2203 here</a></li>
            <li><a href="ymz280b.html">Study the YMZ280B here</a></li>
        </ul>
    <form id="chip-search">
        <label for="search">Search for articles here:</label>
        <input id="search" name="search" type="text" placeholder="Search">
        <button type="submit">Search</button>
        <p id="search-message"></p>
        <script>
            const pages = { ym2151: "ym2151.html", ym2612: "ym2612.html", ym2203: "ym2203.html", ymz280b: "ymz280b.html" };
            const form = document.getElementById("chip-search");
            const box = document.getElementById("search");
            const message = document.getElementById("search-message");
            form.addEventListener("submit", function (event) {
                event.preventDefault();
                const query = box.value.trim().toLowerCase().replace(/\s+/g, "");
                if (!query) {
                    message.textContent = "Enter a chip name (e.g. YM2612)";
                    return;
                }
                const match = Object.keys(pages).find(function (key) {
                    return key.includes(query);
                });
                if (!match) {
                    message.textContent = "Sorry, but that article is not present. Try a different search.";
                    return;
                }
                window.location.href = pages[match];
            });
        </script>
    </form>
</body>
</html>
