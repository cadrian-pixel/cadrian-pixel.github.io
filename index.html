<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>FM SynthWiki</title>
</head>
<body>
    <h1>FM SynthWiki</h1>
    <p>Welcome to FM SynthWiki, the definitive resource for FM technology.</p>
    <h2>List of Current Pages</h2>
        <ul>
            <li><a href="ym2151.html">YM2151</a></li>
            <li><a href="ym2612.html">YM2612</a></li>
            <li><a href="ym2203.html">YM2203</a></li>
            <li><a href="ymz280b.html">YMZ280B</a></li>
        </ul>
    <form id="chip-search">
        <script>
            const pages = { ym2151: "ym2151.html", ym2612: "ym2612.html", ym2203: "ym2203.html", ymz280b: "ymz280b.html" };
            const form = document.getElementById("chip-search");
            const box = document.getElementById("search");
            const message = document.getElementById("search-message");
            form.addEventListener("submit", function (event) {
                event.preventDefault();
                const query = box.value.trim().toLowerCase().replace(/\s+/g, "");
                if (!query) {
                    message.textContent = "Enter a chip name (e.g. YM2612)";
                    return;
                }
                const match = Object.keys(pages).find(function (key) {
                    return key.includes(query);
                });
                if (!match) {
                    message.textContent = "Sorry, but that article is not present. Try a different search.";
                    return;
                }
                window.location.href = pages[match];
            });
        </script>
        <label for="search">Search for articles here:</label>
        <input id="search" type="text" placeholder="Search" name="search">
        <button type="submit">Search</button>
        <p id="search-message"></p>
    </form>
</body>
</html>
